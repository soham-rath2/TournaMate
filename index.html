<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TournaMate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>TournaMate</h1>
        <div class="nav-links"></div>
    </header>
    <div id="app">
        <main>
            <section id="setup" class="view active">
                <div class="setup-grid">
                    <div class="card setup-card shadow-md">
                        <h2>Tournament Setup</h2>
                        <div class="settings-grid">
                            <div class="section-title">General</div>
                            <div class="form-group full-width">
                                <label for="tournament-name">Tournament name</label>
                                <input type="text" id="tournament-name" placeholder="Tournament name"></input>
                            </div>
                            <div class="form-group full-width">
                                <label>Tournament mode</label>
                                <div class="option-group" role="radiogroup">
                                    <label class="option-pill">
                                        <input type="radio" name="tournament-mode" value="TEAM" checked />
                                        <span>Team Tournament</span>
                                    </label>
                                    <label class="option-pill">
                                        <input type="radio" name="tournament-mode" value="SINGLES" />
                                        <span>Individual Tournament</span>
                                    </label>
                                </div>
                            </div>

                            <div class="section-title">Format</div>
                            <div class="form-group">
                                <label for="pairing-system">Pairing system</label>
                                <select id="pairing-system">
                                    <option value="SWISS">Swiss System</option>
                                    <option value="ROUND_ROBBIN">Round Robbin</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Boards/Games per Match</label>
                                <input type="number" id="boards-count" value="4" min="1" max="20"></input>
                            </div>
                            <div class="form-group">
                                <label>Number of Rounds</label>
                                <input type="number" id="total-rounds" value="6" min="1" max="20"></input>
                            </div>
                            <div class="section-title">Rules</div>
                            <div class="form-group full-width">
                                <select id="rules">
                                    <option value="FIDE">Fide</option>
                                    <option value="USCF">USCF</option>
                                    <option value="CUSTOM">Custom</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Points for a Win</label>
                                <input type="number" id="points-win" value="2">
                            </div>
                            <div class="form-group">
                                <label>Points for a Draw</label>
                                <input type="number" id="points-draw" value="1">
                            </div>
                        </div>
                    </div>

                    <!--Add Teams and playerss entering-->
                    <div class="card setup-card shadow-md">
                        <h2>Teams verwalten</h2>
                        <div class="team-input-row">
                            <input type="text" id="new-team-name" placeholder="New Team"
                                onkeydown="if (event.key === 'Enter') addTeam();"></input>
                            <button class="btn primary" onclick="addTeam()">+ Add</button>
                        </div>
                        <ul id="team-list" class="team-list">

                        </ul>
                        <div class="actions" id="team-actions">
                            <button class="btn success large" onclick="startTournament()" id="start-tram-btn">Start
                                Tournament</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="setup.js"></script>
</body>

</html>
